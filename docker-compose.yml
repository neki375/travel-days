# Local development database. Credentials here are for local use only.
name: travel-days

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: travel_days
      POSTGRES_PASSWORD: travel_days
      POSTGRES_DB: travel_days
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_days -d travel_days"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
